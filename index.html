<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital One Employee Verification</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<img id="logo" class="logo" alt="Digital One Logo">

<h1>DIGITAL ONE</h1>

<p>Broadband Internet Service</p>

</div>

<div id="verifyStatus" class="status">

Loading Verification...

</div>

<div class="photo-box">

<img id="photo" src="assets/user.png" alt="Employee">

</div>

<div class="info">

<div class="row">
<span>Employee ID</span>
<b id="employeeid">Loading...</b>
</div>

<div class="row">
<span>Name</span>
<b id="name">Loading...</b>
</div>

<div class="row">
<span>Designation</span>
<b id="designation">Loading...</b>
</div>

<div class="row">
<span>Blood Group</span>
<b id="blood">Loading...</b>
</div>

<div class="row">
<span>Mobile</span>
<b id="mobile">Loading...</b>
</div>

<div class="row">
<span>Joining Date</span>
<b id="joining">Loading...</b>
</div>

<div class="row">
<span>Status</span>
<b id="status">Loading...</b>
</div>

</div>

<div class="footer">

Powered by Digital One Broadband Internet Service

</div>

</div>

</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>

</html>
